# .release-queue.conf: settings for release-queue in this project.
# release-queue sources this file with bash. docs/release-queue/CONFIG.md
# lists every key. Commit this file, so every worktree uses the same values.

# The branch that the conductor integrates batches into.
RQ_MAIN=main

# The ref that counts as released. "ls" shows a merged branch as
# "released" when this ref has its commit.
RQ_RELEASED_REF=origin/main

# yes: a push of RQ_MAIN deploys. Then nobody pushes it between releases.
RQ_PUSH_DEPLOYS=no

# Where "start" and "cut" make worktrees. A relative path is relative to
# the main checkout. {checkout} is the main checkout's directory name.
# {name} is the branch name or the batch id.
RQ_WORKTREE_PATTERN='../{checkout}-{name}'

# The prefix of the batch branches that "cut" makes.
RQ_BATCH_BRANCH_PREFIX=release/

# The decisions log. Leave RQ_DECISIONS_FILE empty when the project has none.
RQ_DECISIONS_FILE=
RQ_ID_PREFIX=D-
RQ_ID_WIDTH=0

# The generated index of the decisions log, and the command that writes it.
# The command runs at the top of a worktree. Leave both empty for no index.
RQ_INDEX_FILE=
RQ_INDEX_CMD=

# The status log. Agents add claim and stop lines to it. Leave it empty
# when the project has none. Only install.sh reads this key.
RQ_STATUS_FILE=docs/STATUS.md

# The project's checks and release steps. Only install.sh reads this key.
RQ_CHECKS_FILE=docs/RELEASE-CHECKS.md

# The procedure that messages point to. install.sh copies the toolkit docs
# into the same directory.
RQ_PROCEDURE=docs/release-queue/PROCEDURE.md

# Release targets. Each rule is "GLOB TARGET[,TARGET...]". In GLOB, *
# matches any characters, / included. A branch that matches no rule ships
# as "none". Example:
#   RQ_TARGETS=(
#     'web/* web'
#     'migrations/* db,api'
#   )
# One target: the container image. A tag X.Y.Z publishes it; a push of
# main publishes only the edge image, which is not a release.
RQ_TARGETS=(
  'src/* image'
  'docs/openapi.yaml image'
  'docs/src/* image'
  'Dockerfile image'
  '.dockerignore image'
  'esbuild.config.mjs image'
  'package.json image'
  'package-lock.json image'
)

# Go binaries, for a project with go.mod at the top. Each rule is
# "DIR TARGET[,TARGET...]". A changed Go package counts for each binary
# that imports it (go list -deps). A change to go.mod or go.sum counts for
# every binary. Example:
#   RQ_GO_BINARIES=(
#     'cmd/server api'
#     'cmd/tool cli'
#   )
RQ_GO_BINARIES=()

# Checks that "add" runs before it queues a branch. Each rule is
# "TARGET COMMAND". The command runs with bash at the top of the worktree
# when the branch ships as TARGET ("*" for every branch). A failure stops
# the add. Use it for fast guards that agents must not skip, for example
# the guards of docs/release-queue/TRUST-THE-READER.md:
#   RQ_ADD_CHECKS=(
#     'cli go test ./internal/cli -run TestSuccessOutputNamesNoCommand'
#     'web cd web && npx vitest run src/copy.test.ts'
#   )
RQ_ADD_CHECKS=(
  '* npm run lint'
  'image npm test'
)
