# One folder of notes, served over HTTPS on port 27124.
# Settings come from a .env file next to this one (see .env.example):
#
#   API_KEY            the bearer token; generate one with `openssl rand -hex 32`
#   VAULT_DIR          the folder to serve
#   BIND_IP            optional: the host address to publish on (default: all)
#   SUBJECT_ALT_NAMES  optional: names for the HTTPS certificate besides BIND_IP

services:
  obsidian-rest:
    image: ghcr.io/heracraft/obsidian-remote-rest-api:latest
    restart: unless-stopped
    # The owner of VAULT_DIR, so files the API writes belong to them.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${VAULT_DIR:?Set VAULT_DIR to the folder to serve}:/vault
    ports:
      - "${BIND_IP:-0.0.0.0}:27124:27124"
    environment:
      API_KEY: "${API_KEY:?Set API_KEY, for example to the output of openssl rand -hex 32}"
      # The certificate covers the address clients dial; add host names here.
      SUBJECT_ALT_NAMES: "${BIND_IP:-},${SUBJECT_ALT_NAMES:-}"
